<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HTML Runner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0f;
  color:white;
  display:flex;
  height:100vh;
}

/* LEFT EDITOR */
#editor{
  width:50%;
  display:flex;
  flex-direction:column;
  border-right:1px solid #2a2a35;
}

textarea{
  flex:1;
  background:#15151c;
  color:white;
  border:none;
  padding:10px;
  outline:none;
  resize:none;
  font-family:monospace;
  font-size:14px;
}

button{
  padding:10px;
  background:#7b2cbf;
  border:none;
  color:white;
  cursor:pointer;
}

/* RIGHT PREVIEW */
#preview{
  width:50%;
  background:white;
}
iframe{
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

<body>

<div id="editor">
  <textarea id="code"><!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Arial; text-align:center; }
h1 { color: purple; }
</style>
</head>

<body>
<h1>Hello World</h1>
<button onclick="alert('It works!')">Click Me</button>

<script>
console.log("HTML Runner active!");
</script>

</body>
</html></textarea>

  <button onclick="run()">RUN ▶</button>
</div>

<div id="preview">
  <iframe id="frame"></iframe>
</div>

<script>
function run(){
  const code = document.getElementById("code").value;
  const frame = document.getElementById("frame");

  frame.srcdoc = code;
}

/* auto run on start */
run();
</script>

</body>
</html>
